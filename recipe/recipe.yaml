schema_version: 1

context:
  version: "0.2.0"

package:
  name: qiskit-mitigation
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/qiskit-mitigation/qiskit_mitigation-${{ version }}.tar.gz
  sha256: cff6f2be4d169ec031dac41631762c042ef1ff3d2378f480c7ba6086c957f375

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27.0
    - pip
  run:
    - python >=${{ python_min }}
    - qiskit >=2.3.0,<3
    - samplomatic >=0.21
    - numpy >=1.26
    - scipy >=1.10

tests:
  - python:
      imports:
        - qiskit_mitigation
      pip_check: true
      python_version:
        - "${{ python_min }}.*"
        - "*"

about:
  summary: Tools for handling errors during quantum computation.
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/qiskit-mitigation/

extra:
  recipe-maintainers:
    - wshanks
